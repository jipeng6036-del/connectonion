name: Claude project discovery verification
on:
  push:
    branches: [verify/2336-project-discovery]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        revision:
          - cf1c4549e5d26373b10d7642d44d62a96031f887
          - 9b7f37c82b8925bdfec93c5d907fdfd2c860f64e
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ matrix.revision }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install exact locked dependencies
        run: |
          python -m pip install uv==0.10.12
          uv sync --frozen --extra dev
      - name: Exact upstream primary CI selection and coverage
        env:
          OPENONION_API_KEY: test-key
          TZ: UTC
        run: |
          uv run --frozen --extra dev pytest tests/ -n auto --dist loadfile --tb=short \
            -m "not slow and not real_api and not network" \
            --cov=connectonion --cov-report=term-missing:skip-covered --cov-report=xml \
            --cov-fail-under=78 --junitxml=results.xml
      - name: Save actual outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: results-${{ matrix.revision }}
          path: |
            results.xml
            coverage.xml
